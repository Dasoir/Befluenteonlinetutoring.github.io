<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Befluente Learning Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ==================== SPLASH SCREEN ==================== */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out;
        }
        #splash-screen.fade-out { opacity: 0; pointer-events: none; }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 5em;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 20px;
            animation: bounceIn 1.5s ease-out, glow 2s ease-in-out infinite alternate;
        }
        .logo-tagline { font-size: 1.5em; color: #a8d8ff; animation: fadeInUp 1s ease-out 0.5s both; }
        .loading-bar { width: 300px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; margin-top: 40px; overflow: hidden; }
        .loading-progress { height: 100%; background: linear-gradient(90deg, #00f260, #0575e6); border-radius: 10px; animation: loadProgress 2.5s ease-out forwards; }

        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes glow { from { text-shadow: 0 0 20px rgba(255,255,255,0.5); } to { text-shadow: 0 0 40px rgba(255,255,255,0.9), 0 0 60px rgba(255,255,255,0.5); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes loadProgress { from { width: 0%; } to { width: 100%; } }

        /* ==================== MAIN SCREENS ==================== */
        .screen {
            display: none; /* Hidden by default */
            width: 90%;
            max-width: 800px;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: slideIn 0.6s ease-out;
        }
        .screen.active { display: block; } /* Only shows when active class is added */

        @keyframes slideIn { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Fredoka One', cursive; color: #667eea; text-align: center; font-size: 3em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.2em; }

        /* ==================== FORM & BUTTONS ==================== */
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #555; font-size: 1.1em; }
        input, select { width: 100%; padding: 15px 20px; font-size: 1.1em; border: 3px solid #e0e0e0; border-radius: 15px; font-family: 'Nunito', sans-serif; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.1); }

        .btn { padding: 15px 40px; font-size: 1.2em; font-weight: 700; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s; font-family: 'Fredoka One', cursive; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:hover { transform: translateY(-3px) scale(1.05); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white; }

        /* ==================== GAME BOARD ==================== */
        .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .score-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .score-card.teacher { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
        .score-value { font-family: 'Fredoka One', cursive; font-size: 2.5em; }

        .game-area { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 20px; padding: 40px; text-align: center; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .dice { width: 120px; height: 120px; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 4em; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; border: 4px solid #667eea; transition: transform 0.3s; user-select: none; }
        .dice:hover { transform: scale(1.1) rotate(5deg); }
        .dice.rolling { animation: rollDice 0.5s ease-in-out infinite; }
        @keyframes rollDice { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(90deg) scale(1.2); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg) scale(1.2); } }
        .space-info { font-size: 1.5em; color: #555; margin-top: 20px; font-weight: 700; }

        /* ==================== MODAL ==================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .question-modal { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; border-radius: 30px; max-width: 700px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.4); animation: modalSlideIn 0.4s; text-align: center; }
        @keyframes modalSlideIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-category { font-family: 'Fredoka One', cursive; font-size: 1.8em; background: rgba(255,255,255,0.2); padding: 10px 30px; border-radius: 50px; display: inline-block; margin-bottom: 20px; }
        .question-text { font-size: 1.6em; margin-bottom: 30px; line-height: 1.4; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .option-btn { background: white; color: #667eea; border: none; padding: 20px; font-size: 1.2em; border-radius: 15px; cursor: pointer; transition: all 0.3s; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .option-btn:hover { transform: translateY(-3px); }
        .option-btn.selected { background: #ffd700; color: #333; transform: scale(1.05); }
        .option-btn.correct { background: #00f260; color: white; }
        .option-btn.wrong { background: #eb3349; color: white; }

        .feedback { font-size: 1.3em; font-weight: 700; min-height: 40px; margin-top: 10px; }

        /* ==================== CONFETTI ==================== */
        .confetti { position: fixed; width: 10px; height: 10px; top: -10px; animation: confetti-fall 3s linear forwards; z-index: 1000; }
        @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        .sound-toggle { position: fixed; top: 20px; right: 20px; background: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5em; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 50; }
    </style>
</head>
<body>

    <button class="sound-toggle" onclick="toggleSound()" id="sound-btn">🔊</button>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="logo">🎓 Befluente</div>
        <div class="logo-tagline">Learning Through Play</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>Math Opoly</h1>
        <p class="subtitle">Customize Your Learning Adventure!</p>
        
        <div class="form-group">
            <label>👤 Player Name</label>
            <input type="text" id="player-name" placeholder="Enter your name" value="Student">
        </div>
        <div class="form-group">
            <label> Subject</label>
            <select id="subject-select">
                <option value="Math"> Mathematics</option>
                <option value="Science">🔬 Science</option>
                <option value="History">📜 History</option>
                <option value="English">📖 English</option>
            </select>
        </div>
        <div class="form-group">
            <label>⚡ Difficulty</label>
            <select id="difficulty-select">
                <option value="easy">🌱 Easy</option>
                <option value="medium" selected>🌟 Medium</option>
                <option value="hard"> Hard</option>
            </select>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-primary" onclick="startGame()">🎲 START GAME!</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="scoreboard">
            <div class="score-card">
                <div>👦 <span id="display-name">Student</span></div>
                <div class="score-value">$<span id="student-score">0</span></div>
            </div>
            <div class="score-card teacher">
                <div>👩‍🏫 Teacher</div>
                <div class="score-value">$<span id="teacher-score">0</span></div>
            </div>
        </div>
        <div class="game-area">
            <div class="dice" id="dice" onclick="rollDice()">🎲</div>
            <p style="font-size: 1.2em; color: #666; margin-top: 20px;">Click the dice to roll!</p>
            <div class="space-info" id="current-space">Start - Roll to begin!</div>
        </div>
    </div>

    <!-- QUESTION MODAL -->
    <div class="modal-overlay" id="question-modal">
        <div class="question-modal">
            <div class="modal-category" id="modal-category">Math - $200</div>
            <div class="question-text" id="modal-question">Loading...</div>
            <div class="options-grid" id="modal-options"></div>
            <div>
                <button class="btn btn-success" onclick="submitAnswer()">✅ Submit</button>
                <button class="btn btn-danger" onclick="skipQuestion()">⏭️ Skip</button>
            </div>
            <div class="feedback" id="modal-feedback"></div>
        </div>
    </div>

    <script>
        // ==================== GAME STATE ====================
        let playerName = "Student", currentSubject = "Math", difficulty = "medium";
        let studentScore = 0, teacherScore = 0, currentQuestion = null, selectedOption = null, isRolling = false, soundEnabled = true;

        // ==================== FIX: SPLASH SCREEN LOGIC ====================
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    // THIS WAS THE MISSING PIECE!
                    document.getElementById('start-screen').classList.add('active'); 
                }, 800);
            }, 2500); // 2.5 second splash
        });

        // ==================== SOUNDS ====================
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            
            if (type === 'dice') {
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, ctx.currentTime);
                osc.frequency.setValueAtTime(783, ctx.currentTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        }

        // ==================== GAME LOGIC ====================
        function startGame() {
            playerName = document.getElementById('player-name').value || "Student";
            currentSubject = document.getElementById('subject-select').value;
            difficulty = document.getElementById('difficulty-select').value;
            
            document.getElementById('display-name').innerText = playerName;
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }

        async function rollDice() {
            if (isRolling) return;
            isRolling = true;
            const diceEl = document.getElementById('dice');
            diceEl.classList.add('rolling');
            playSound('dice');
            
            let roll = 1;
            const interval = setInterval(() => { roll = Math.floor(Math.random() * 6) + 1; diceEl.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][roll-1]; }, 100);

            setTimeout(() => {
                clearInterval(interval);
                diceEl.classList.remove('rolling');
                isRolling = false;
                
                const categories = ["Basic", "Advanced", "Word Problem", "Challenge"];
                const category = categories[Math.floor(Math.random() * categories.length)];
                const points = [200, 220, 240, 260][Math.floor(Math.random() * 4)];
                
                document.getElementById('current-space').innerText = `${category} - $${points} | Rolled: ${roll}`;
                fetchQuestion(category, points);
            }, 1000);
        }

        function fetchQuestion(category, points) {
            document.getElementById('modal-category').innerText = `${currentSubject} - ${category} ($${points})`;
            document.getElementById('modal-question').innerText = "🤔 AI is thinking...";
            document.getElementById('modal-options').innerHTML = "";
            document.getElementById('modal-feedback').innerText = "";
            document.getElementById('question-modal').classList.add('active');
            selectedOption = null;

            // Mock AI Delay
            setTimeout(() => {
                const mocks = {
                    'Math': { q: `If ${playerName} has 12 apples and gives away 5, how many are left?`, opts: ["5", "6", "7", "8"], ans: "7", exp: "12 - 5 = 7!" },
                    'Science': { q: `What planet is known as the Red Planet?`, opts: ["Venus", "Mars", "Jupiter", "Saturn"], ans: "Mars", exp: "Mars has iron oxide (rust) on its surface!" },
                    'History': { q: `Who was the first US President?`, opts: ["Jefferson", "Lincoln", "Washington", "Adams"], ans: "Washington", exp: "George Washington served from 1789-1797." },
                    'English': { q: `Which word is a synonym for "happy"?`, opts: ["Sad", "Angry", "Joyful", "Tired"], ans: "Joyful", exp: "Joyful means feeling great happiness!" }
                };
                const m = mocks[currentSubject] || mocks['Math'];
                currentQuestion = { question: m.q, options: m.opts, correct_answer: m.ans, explanation: m.exp };
                renderQuestion();
            }, 800);
        }

        function renderQuestion() {
            document.getElementById('modal-question').innerText = currentQuestion.question;
            const container = document.getElementById('modal-options');
            currentQuestion.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + i)}) ${opt}`;
                btn.onclick = () => { document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); selectedOption = opt; };
                container.appendChild(btn);
            });
        }

        function submitAnswer() {
            if (!selectedOption) { document.getElementById('modal-feedback').innerText = "⚠️ Pick an answer first!"; return; }
            const fb = document.getElementById('modal-feedback');
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => { if (b.innerText.includes(currentQuestion.correct_answer)) b.classList.add('correct'); });

            if (selectedOption === currentQuestion.correct_answer) {
                fb.innerHTML = `✅ <strong>Correct!</strong> ${currentQuestion.explanation}`;
                fb.style.color = "#00f260";
                studentScore += 200; playSound('correct'); createConfetti();
            } else {
                fb.innerHTML = ` <strong>Oops!</strong> Answer: ${currentQuestion.correct_answer}`;
                fb.style.color = "#ff6b6b";
                teacherScore += 200; playSound('wrong');
            }
            updateScores();
            setTimeout(() => document.getElementById('question-modal').classList.remove('active'), 3000);
        }

        function skipQuestion() {
            teacherScore += 200; playSound('wrong'); updateScores();
            document.getElementById('question-modal').classList.remove('active');
        }

        function updateScores() {
            document.getElementById('student-score').innerText = studentScore;
            document.getElementById('teacher-score').innerText = teacherScore;
        }

        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3', '#00bcd4', '#4CAF50', '#FFEB3B', '#FF9800'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }
        }
    </script>
</body>
</html>
