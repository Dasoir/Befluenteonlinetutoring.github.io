<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Opoly - K-12 Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .game-header { text-align: center; margin-bottom: 15px; }
  .game-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5em;
    color: #fff;
    text-shadow: 3px 3px 0 #c41e3a, 6px 6px 0 rgba(0,0,0,0.3);
    letter-spacing: 2px;
  }
  .game-subtitle {
    color: #ffd700;
    font-size: 1.1em;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 5px;
  }

  /* Difficulty Selector */
  .difficulty-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diff-btn {
    padding: 10px 22px;
    border: 3px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .diff-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .diff-btn.active {
    background: #ffd700;
    color: #1e3c72;
    border-color: #ffd700;
    box-shadow: 0 4px 15px rgba(255,215,0,0.5);
  }

  .scoreboard { display: flex; gap: 20px; margin-bottom: 15px; }
  .score-card {
    background: rgba(255,255,255,0.95);
    padding: 12px 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
    min-width: 160px;
  }
  .score-card.student { border-top: 5px solid #3b82f6; }
  .score-card.teacher { border-top: 5px solid #ef4444; }
  .score-label { font-size: 0.85em; color: #666; font-weight: 700; }
  .score-value { font-family: 'Fredoka One', cursive; font-size: 1.8em; color: #1e3c72; }
  .score-card.teacher .score-value { color: #c41e3a; }

  .board-container {
    position: relative;
    width: 780px;
    height: 540px;
    background: linear-gradient(135deg, #f5f5dc 0%, #e8dcc0 100%);
    border-radius: 20px;
    border: 8px solid #2c1810;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    padding: 15px;
  }

  .board-center {
    position: absolute;
    top: 110px; left: 110px; right: 110px; bottom: 110px;
    background: linear-gradient(135deg, #87ceeb 0%, #4a90e2 100%);
    border-radius: 15px;
    border: 4px solid #2c1810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .center-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2em;
    color: #fff;
    text-shadow: 3px 3px 0 #c41e3a, 5px 5px 0 rgba(0,0,0,0.3);
    text-align: center;
    z-index: 1;
    letter-spacing: 2px;
  }
  .center-subtitle {
    color: #ffd700;
    font-weight: 900;
    font-size: 1em;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 5px;
    z-index: 1;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }
  .center-mascot { font-size: 4em; margin-top: 10px; z-index: 1; }
  .center-message {
    background: rgba(255,255,255,0.95);
    padding: 10px 20px;
    border-radius: 10px;
    margin-top: 15px;
    font-weight: 700;
    color: #1e3c72;
    z-index: 1;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 80%;
    text-align: center;
  }

  .space {
    position: absolute;
    width: 95px;
    height: 95px;
    background: #fff;
    border: 2px solid #2c1810;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5px;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  .space-header {
    width: 100%;
    height: 22px;
    border-radius: 5px 5px 0 0;
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6em;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .space-body { margin-top: 22px; font-size: 0.65em; font-weight: 700; color: #333; line-height: 1.2; }
  .space-price { font-family: 'Fredoka One', cursive; font-size: 0.8em; color: #1e3c72; margin-top: 2px; }
  
  .space-corner {
    width: 110px;
    height: 110px;
    background: #fff;
    border: 3px solid #2c1810;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .corner-icon { font-size: 2em; margin-bottom: 5px; }
  .corner-title { font-family: 'Fredoka One', cursive; font-size: 0.85em; color: #c41e3a; line-height: 1.1; }
  .corner-sub { font-size: 0.65em; color: #666; font-weight: 700; margin-top: 3px; }

  .color-red { background: #ef4444; }
  .color-blue { background: #3b82f6; }
  .color-green { background: #22c55e; }
  .color-yellow { background: #eab308; }
  .color-purple { background: #a855f7; }
  .color-orange { background: #f97316; }
  .color-pink { background: #ec4899; }
  .color-cyan { background: #06b6d4; }
  .color-lime { background: #84cc16; }
  .color-indigo { background: #6366f1; }

  .token {
    position: absolute;
    width: 50px;
    height: 50px;
    font-size: 2.5em;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    transition: left 0.35s ease, top 0.35s ease;
    pointer-events: none;
  }
  .token.hopping { animation: hop 0.35s ease-out; }
  @keyframes hop {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -90%) scale(1.3); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .dice-area { margin-top: 20px; display: flex; align-items: center; gap: 20px; }
  .dice {
    width: 80px;
    height: 80px;
    background: #fff;
    border-radius: 15px;
    border: 4px solid #2c1810;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8em;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    user-select: none;
  }
  .dice.rolling { animation: diceRoll 0.15s infinite; }
  @keyframes diceRoll {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(90deg); }
    50% { transform: rotate(180deg); }
    75% { transform: rotate(270deg); }
    100% { transform: rotate(360deg); }
  }
  .roll-btn {
    padding: 14px 32px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    transition: all 0.3s;
  }
  .roll-btn:hover:not(:disabled) { transform: translateY(-3px); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }

  .question-modal {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 35px;
    border-radius: 25px;
    max-width: 550px;
    width: 100%;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    animation: modalPop 0.4s;
    position: relative;
  }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

  .modal-category-wrap { text-align: center; }
  .modal-category {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1em;
    background: rgba(255,255,255,0.2);
    padding: 8px 20px;
    border-radius: 50px;
    display: inline-block;
    margin-bottom: 15px;
  }
  .modal-points {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8em;
    color: #ffd700;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    margin-bottom: 15px;
    text-align: center;
  }
  .modal-question {
    font-size: 1.3em;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.4;
    font-weight: 700;
  }
  .modal-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .option-btn {
    background: #fff;
    color: #667eea;
    border: 3px solid transparent;
    padding: 12px;
    border-radius: 12px;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .option-btn:hover { transform: translateY(-2px); }
  .option-btn.selected { border-color: #ffd700; background: #fff9c4; }
  .option-btn.correct { background: #22c55e; color: #fff; border-color: #16a34a; }
  .option-btn.wrong { background: #ef4444; color: #fff; border-color: #dc2626; }

  .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-btn {
    padding: 10px 22px;
    border: none;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-btn.submit { background: #22c55e; color: #fff; }
  .modal-btn.skip { background: #ef4444; color: #fff; }
  .modal-btn:hover { transform: translateY(-2px); }

  .modal-feedback {
    text-align: center;
    margin-top: 12px;
    font-size: 1em;
    font-weight: 700;
    min-height: 25px;
  }

  .confetti {
    position: fixed;
    width: 10px; height: 10px;
    top: -10px;
    animation: confettiFall 3s linear forwards;
    z-index: 2000;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 820px) {
    .board-container { transform: scale(0.65); transform-origin: top center; margin-bottom: -180px; }
    .game-title { font-size: 1.8em; }
  }
</style>
</head>
<body>

<div class="game-header">
  <div class="game-title">MATH OPOLY</div>
  <div class="game-subtitle">Think • Solve • Strategize • Win!</div>
</div>

<!-- Difficulty Selector -->
<div class="difficulty-bar">
  <button class="diff-btn active" data-level="k2" onclick="setDifficulty('k2')">K-2</button>
  <button class="diff-btn" data-level="3-5" onclick="setDifficulty('3-5')">3-5</button>
  <button class="diff-btn" data-level="6-8" onclick="setDifficulty('6-8')">6-8</button>
  <button class="diff-btn" data-level="9-12" onclick="setDifficulty('9-12')">9-12</button>
</div>

<div class="scoreboard">
  <div class="score-card student">
    <div class="score-label">👦 Student</div>
    <div class="score-value">$<span id="studentScore">0</span></div>
  </div>
  <div class="score-card teacher">
    <div class="score-label">‍🏫 Teacher</div>
    <div class="score-value">$<span id="teacherScore">0</span></div>
  </div>
</div>

<div class="board-container" id="board">
  <div class="board-center">
    <div class="center-title">MATH OPOLY</div>
    <div class="center-subtitle">Think • Solve • Win!</div>
    <div class="center-mascot"></div>
    <div class="center-message" id="centerMessage">Select difficulty & roll the dice!</div>
  </div>
  <div class="token" id="token">🚗</div>
</div>

<div class="dice-area">
  <div class="dice" id="dice">🎲</div>
  <button class="roll-btn" id="rollBtn" onclick="rollDice()">🎲 ROLL DICE!</button>
</div>

<!-- Question Modal -->
<div class="modal-overlay" id="questionModal">
  <div class="question-modal">
    <div class="modal-category-wrap">
      <div class="modal-category" id="modalCategory">Math - $200</div>
    </div>
    <div class="modal-points" id="modalPoints">$200</div>
    <div class="modal-question" id="modalQuestion">Loading question...</div>
    <div class="modal-options" id="modalOptions"></div>
    <div class="modal-buttons">
      <button class="modal-btn submit" onclick="submitAnswer()">✅ Submit Answer</button>
      <button class="modal-btn skip" onclick="skipQuestion()">⏭️ Skip (Teacher gets points)</button>
    </div>
    <div class="modal-feedback" id="modalFeedback"></div>
  </div>
</div>

<script>
// ==================== GAME STATE ====================
let studentScore = 0;
let teacherScore = 0;
let currentPosition = 0;
let isRolling = false;
let currentQuestion = null;
let selectedOption = null;
let currentDifficulty = 'k2';
let moveSteps = 0;
let stepsTaken = 0;
let moveTimer = null;

// ==================== QUESTION BANKS BY DIFFICULTY ====================
const questionBanks = {
  'k2': {
    'PEMDAS': { category: 'Basic Operations', price: '$100', questions: [
      { q: 'What is 5 + 3?', opts: ['7', '8', '9', '6'], ans: '8', exp: '5 + 3 = 8' },
      { q: 'What is 10 - 4?', opts: ['5', '6', '7', '4'], ans: '6', exp: '10 - 4 = 6' },
      { q: 'What is 2 + 7?', opts: ['8', '9', '10', '7'], ans: '9', exp: '2 + 7 = 9' }
    ]},
    '5-DIGIT ADD': { category: 'Addition', price: '$100', questions: [
      { q: 'What is 12 + 15?', opts: ['25', '27', '28', '26'], ans: '27', exp: '12 + 15 = 27' },
      { q: 'What is 20 + 30?', opts: ['40', '50', '60', '45'], ans: '50', exp: '20 + 30 = 50' },
      { q: 'What is 8 + 7?', opts: ['14', '15', '16', '13'], ans: '15', exp: '8 + 7 = 15' }
    ]},
    '5-DIGIT SUB': { category: 'Subtraction', price: '$100', questions: [
      { q: 'What is 15 - 8?', opts: ['6', '7', '8', '5'], ans: '7', exp: '15 - 8 = 7' },
      { q: 'What is 20 - 5?', opts: ['14', '15', '16', '13'], ans: '15', exp: '20 - 5 = 15' },
      { q: 'What is 9 - 3?', opts: ['5', '6', '7', '4'], ans: '6', exp: '9 - 3 = 6' }
    ]},
    'MULTIPLY': { category: 'Multiplication', price: '$150', questions: [
      { q: 'What is 3 × 4?', opts: ['10', '11', '12', '13'], ans: '12', exp: '3 × 4 = 12' },
      { q: 'What is 5 × 2?', opts: ['8', '9', '10', '11'], ans: '10', exp: '5 × 2 = 10' },
      { q: 'What is 2 × 6?', opts: ['10', '11', '12', '13'], ans: '12', exp: '2 × 6 = 12' }
    ]},
    'DIVISION': { category: 'Division', price: '$150', questions: [
      { q: 'What is 10 ÷ 2?', opts: ['4', '5', '6', '3'], ans: '5', exp: '10 ÷ 2 = 5' },
      { q: 'What is 12 ÷ 3?', opts: ['3', '4', '5', '6'], ans: '4', exp: '12 ÷ 3 = 4' },
      { q: 'What is 8 ÷ 2?', opts: ['3', '4', '5', '6'], ans: '4', exp: '8 ÷ 2 = 4' }
    ]},
    'WORD PROB': { category: 'Word Problem', price: '$200', questions: [
      { q: 'Sara has 5 apples. She gets 3 more. How many total?', opts: ['7', '8', '9', '6'], ans: '8', exp: '5 + 3 = 8 apples' },
      { q: 'Tom has 10 cookies. He eats 4. How many left?', opts: ['5', '6', '7', '4'], ans: '6', exp: '10 - 4 = 6 cookies' },
      { q: 'There are 3 boxes with 4 toys each. How many toys?', opts: ['10', '11', '12', '13'], ans: '12', exp: '3 × 4 = 12 toys' }
    ]},
    'FRACTIONS': { category: 'Fractions', price: '$100', questions: [
      { q: 'Which is bigger: 1/2 or 1/4?', opts: ['1/4', '1/2', 'Same', 'Neither'], ans: '1/2', exp: '1/2 is bigger than 1/4' },
      { q: 'What is 1/2 of 10?', opts: ['4', '5', '6', '3'], ans: '5', exp: 'Half of 10 is 5' },
      { q: 'Which fraction shows half?', opts: ['1/3', '1/4', '1/2', '2/3'], ans: '1/2', exp: '1/2 means one half' }
    ]},
    'DECIMALS': { category: 'Decimals', price: '$100', questions: [
      { q: 'Which is bigger: 0.5 or 0.3?', opts: ['0.3', '0.5', 'Same', 'Neither'], ans: '0.5', exp: '0.5 is bigger than 0.3' },
      { q: 'What is 0.5 as a fraction?', opts: ['1/4', '1/3', '1/2', '2/3'], ans: '1/2', exp: '0.5 = 1/2' },
      { q: 'Which is smaller: 0.1 or 0.9?', opts: ['0.9', '0.1', 'Same', 'Neither'], ans: '0.1', exp: '0.1 is smaller than 0.9' }
    ]},
    'TRIANGLE': { category: 'Shapes', price: '$100', questions: [
      { q: 'How many sides does a triangle have?', opts: ['2', '3', '4', '5'], ans: '3', exp: 'A triangle has 3 sides' },
      { q: 'How many sides does a square have?', opts: ['3', '4', '5', '6'], ans: '4', exp: 'A square has 4 sides' },
      { q: 'Which shape has no corners?', opts: ['Square', 'Triangle', 'Circle', 'Rectangle'], ans: 'Circle', exp: 'A circle has no corners' }
    ]},
    'PERCENT': { category: 'Counting', price: '$100', questions: [
      { q: 'Count: 2, 4, 6, 8, ___?', opts: ['9', '10', '11', '12'], ans: '10', exp: 'Counting by 2s: 2, 4, 6, 8, 10' },
      { q: 'What comes after 19?', opts: ['18', '20', '21', '17'], ans: '20', exp: 'After 19 comes 20' },
      { q: 'Which is an even number?', opts: ['3', '5', '7', '8'], ans: '8', exp: '8 is even (divisible by 2)' }
    ]},
    'DEC × WHOLE': { category: 'Money', price: '$150', questions: [
      { q: 'A pencil costs $1. You buy 3. Total?', opts: ['$2', '$3', '$4', '$5'], ans: '$3', exp: '$1 × 3 = $3' },
      { q: 'A candy is $2. You buy 4. Total?', opts: ['$6', '$7', '$8', '$9'], ans: '$8', exp: '$2 × 4 = $8' },
      { q: 'You have $10. Spend $3. How much left?', opts: ['$6', '$7', '$8', '$9'], ans: '$7', exp: '$10 - $3 = $7' }
    ]},
    'DIV WORD': { category: 'Sharing', price: '$150', questions: [
      { q: '6 cookies shared by 2 friends. Each gets?', opts: ['2', '3', '4', '5'], ans: '3', exp: '6 ÷ 2 = 3 cookies each' },
      { q: '8 toys shared by 4 kids. Each gets?', opts: ['1', '2', '3', '4'], ans: '2', exp: '8 ÷ 4 = 2 toys each' },
      { q: '10 apples shared by 5 friends. Each gets?', opts: ['1', '2', '3', '4'], ans: '2', exp: '10 ÷ 5 = 2 apples each' }
    ]},
    'MULT WORD': { category: 'Groups', price: '$150', questions: [
      { q: '4 bags with 3 apples each. Total apples?', opts: ['10', '11', '12', '13'], ans: '12', exp: '4 × 3 = 12 apples' },
      { q: '5 boxes with 2 toys each. Total toys?', opts: ['8', '9', '10', '11'], ans: '10', exp: '5 × 2 = 10 toys' },
      { q: '3 packs with 5 stickers each. Total?', opts: ['13', '14', '15', '16'], ans: '15', exp: '3 × 5 = 15 stickers' }
    ]},
    'COMPOSITE': { category: 'Patterns', price: '$150', questions: [
      { q: 'What comes next: 1, 3, 5, 7, ___?', opts: ['8', '9', '10', '11'], ans: '9', exp: 'Odd numbers: 1, 3, 5, 7, 9' },
      { q: 'What comes next: 10, 20, 30, ___?', opts: ['35', '40', '45', '50'], ans: '40', exp: 'Counting by 10s: 10, 20, 30, 40' },
      { q: 'What comes next: 2, 4, 8, 16, ___?', opts: ['20', '24', '32', '30'], ans: '32', exp: 'Doubling: 2, 4, 8, 16, 32' }
    ]},
    'SCI NOTATION': { category: 'Place Value', price: '$150', questions: [
      { q: 'What is the value of 5 in 53?', opts: ['5', '50', '500', '3'], ans: '50', exp: '5 is in the tens place = 50' },
      { q: 'What is 100 + 20 + 5?', opts: ['125', '152', '215', '512'], ans: '125', exp: '100 + 20 + 5 = 125' },
      { q: 'Which number has 3 hundreds?', opts: ['234', '345', '456', '123'], ans: '345', exp: '345 has 3 in the hundreds place' }
    ]},
    'FRACT MULT': { category: 'Measurement', price: '$100', questions: [
      { q: 'How many inches in 1 foot?', opts: ['10', '12', '14', '16'], ans: '12', exp: '1 foot = 12 inches' },
      { q: 'How many minutes in 1 hour?', opts: ['30', '45', '60', '90'], ans: '60', exp: '1 hour = 60 minutes' },
      { q: 'Which is longer: 1 foot or 1 inch?', opts: ['1 inch', '1 foot', 'Same', 'Neither'], ans: '1 foot', exp: '1 foot = 12 inches, so it\'s longer' }
    ]},

// ==================== BOARD SPACES ====================

  { name: "START", type: "corner", icon: "🏁", price: "Collect $200" },
  { name: "PEMDAS", type: "space", color: "color-blue", price: "$200" },
  { name: "5-DIGIT ADD", type: "space", color: "color-green", price: "$220" },
  { name: "5-DIGIT SUB", type: "space", color: "color-yellow", price: "$220" },
  { name: "MULTIPLY", type: "space", color: "color-purple", price: "$240" },

  { name: "FRACTIONS", type: "space", color: "color-cyan", price: "$220" },
  { name: "DECIMALS", type: "space", color: "color-lime", price: "$220" },
  { name: "FREE PARKING", type: "corner", icon: "🅿️", price: "Rest!" },

];

// ==================== INIT ====================
window.addEventListener('load', () => {
  initBoard();
});

function setDifficulty(level) {
  currentDifficulty = level;
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === level);
  });
  document.getElementById('centerMessage').innerText = `Difficulty set to ${level}! Roll the dice!`;
}

function initBoard() {
  const board = document.getElementById('board');
  const boardWidth = 780;
  const boardHeight = 540;
  const spaceSize = 95;
  const cornerSize = 110;
  const padding = 15;
  
  const positions = [];
  
  // Top row (0-5)
  const topY = padding;
  const topSpacing = (boardWidth - cornerSize * 2 - padding * 2) / 4;
  for (let i = 0; i <= 5; i++) {
    if (i === 0 || i === 5) {
      positions.push({ x: i === 0 ? padding : boardWidth - cornerSize - padding, y: topY, isCorner: true });
    } else {
      positions.push({ x: padding + cornerSize + (i - 1) * topSpacing + (topSpacing - spaceSize) / 2, y: topY + (cornerSize - spaceSize) / 2, isCorner: false });
    }
  }
  
  // Right column (6-9)
  const rightX = boardWidth - cornerSize - padding;
  const rightSpacing = (boardHeight - cornerSize * 2 - padding * 2) / 3;
  for (let i = 6; i <= 9; i++) {
    const row = i - 6;
    positions.push({ x: rightX + (cornerSize - spaceSize) / 2, y: padding + cornerSize + row * rightSpacing + (rightSpacing - spaceSize) / 2, isCorner: false });
  }
  
  // Bottom row (10-15)
  const bottomY = boardHeight - cornerSize - padding;
  const bottomSpacing = (boardWidth - cornerSize * 2 - padding * 2) / 4;
  for (let i = 10; i <= 15; i++) {
    const col = 5 - (i - 10);
    if (i === 10 || i === 15) {
      positions.push({ x: i === 10 ? boardWidth - cornerSize - padding : padding, y: bottomY, isCorner: true });
    } else {
      positions.push({ x: padding + cornerSize + (col - 1) * bottomSpacing + (bottomSpacing - spaceSize) / 2, y: bottomY + (cornerSize - spaceSize) / 2, isCorner: false });
    }
  }
  
  // Left column (16-19)
  const leftX = padding;
  const leftSpacing = (boardHeight - cornerSize * 2 - padding * 2) / 3;
  for (let i = 16; i <= 19; i++) {
    const row = 3 - (i - 16);
    positions.push({ x: leftX + (cornerSize - spaceSize) / 2, y: padding + cornerSize + row * leftSpacing + (leftSpacing - spaceSize) / 2, isCorner: false });
  }
  
  spaces.forEach((space, i) => {
    const pos = positions[i];
    const el = document.createElement('div');
    
    if (space.type === 'corner') {
      el.className = 'space-corner';
      el.innerHTML = `<div class="corner-icon">${space.icon}</div><div class="corner-title">${space.name}</div><div class="corner-sub">${space.price}</div>`;
    } else {
      el.className = 'space';
      el.innerHTML = `<div class="space-header ${space.color}">${space.name}</div><div class="space-body">${space.name}</div><div class="space-price">${space.price}</div>`;
    }
    
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    board.appendChild(el);
    
    space.centerX = pos.x + (space.type === 'corner' ? cornerSize : spaceSize) / 2;
    space.centerY = pos.y + (space.type === 'corner' ? cornerSize : spaceSize) / 2;
  });
  
  moveTokenTo(0);
}

function moveTokenTo(index) {
  const token = document.getElementById('token');
  const space = spaces[index];
  token.style.left = space.centerX + 'px';
  token.style.top = space.centerY + 'px';
  token.style.transform = 'translate(-50%, -50%)';
  token.classList.add('hopping');
  setTimeout(() => token.classList.remove('hopping'), 350);
}

function rollDice() {
  if (isRolling) return;
  isRolling = true;
  
  const diceEl = document.getElementById('dice');
  const rollBtn = document.getElementById('rollBtn');
  rollBtn.disabled = true;
  diceEl.classList.add('rolling');
  
  // Roll animation using setInterval (safe, no infinite loop detection)
  let rollCount = 0;
  const rollInterval = setInterval(() => {
    const randomFace = Math.floor(Math.random() * 6);
    diceEl.innerText = ['⚀','','⚂','⚃','','⚅'][randomFace];
    rollCount++;
    if (rollCount >= 10) {
      clearInterval(rollInterval);
      const finalRoll = Math.floor(Math.random() * 6) + 1;
      diceEl.classList.remove('rolling');
      diceEl.innerText = ['⚀','⚁','','⚃','⚄',''][finalRoll - 1];
      document.getElementById('centerMessage').innerText = `You rolled a ${finalRoll}! Moving...`;
      startMovement(finalRoll);
    }
  }, 100);
}

function startMovement(roll) {
  moveSteps = roll;
  stepsTaken = 0;
  // Use setInterval for movement (safe from loop detection)
  moveTimer = setInterval(() => {
    if (stepsTaken >= moveSteps) {
      clearInterval(moveTimer);
      onLanding();
      return;
    }
    currentPosition = (currentPosition + 1) % spaces.length;
    moveTokenTo(currentPosition);
    stepsTaken++;
  }, 500);
}

function onLanding() {
  const landedSpace = spaces[currentPosition];
  document.getElementById('centerMessage').innerText = `Landed on: ${landedSpace.name}!`;
  
  setTimeout(() => {
    if (landedSpace.type === 'corner') {
      if (landedSpace.name === 'START') {
        studentScore += 200;
        updateScores();
        document.getElementById('centerMessage').innerText = ' Passed START! Collect $200!';
        createConfetti(30);
      } else if (landedSpace.name === 'GOAL!') {
        studentScore += 500;
        updateScores();
        document.getElementById('centerMessage').innerText = '🏆 YOU WIN! Math Champion!';
        createConfetti(100);
      } else if (landedSpace.name === 'FREE PARKING') {
        document.getElementById('centerMessage').innerText = '🅿️ Free Parking! Take a break!';
      }
      document.getElementById('rollBtn').disabled = false;
      isRolling = false;
    } else {
      showQuestion(landedSpace);
    }
  }, 600);
}

function showQuestion(space) {
  // Get question bank for current difficulty
  const bank = questionBanks[currentDifficulty];
  const spaceData = bank[space.name];
  
  if (!spaceData) {
    document.getElementById('centerMessage').innerText = 'No questions for this space at this level!';
    document.getElementById('rollBtn').disabled = false;
    isRolling = false;
    return;
  }
  
  // Pick random question from the bank
  const questions = spaceData.questions;
  const randomQ = questions[Math.floor(Math.random() * questions.length)];
  currentQuestion = { ...randomQ, price: spaceData.price, category: spaceData.category };
  
  document.getElementById('modalCategory').innerText = `${spaceData.category} (${currentDifficulty})`;
  document.getElementById('modalPoints').innerText = spaceData.price;
  document.getElementById('modalQuestion').innerText = randomQ.q;
  document.getElementById('modalFeedback').innerText = '';
  document.getElementById('questionModal').classList.add('active');
  selectedOption = null;
  
  const optionsContainer = document.getElementById('modalOptions');
  optionsContainer.innerHTML = '';
  
  randomQ.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = `${String.fromCharCode(65 + i)}) ${opt}`;
    btn.onclick = () => {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedOption = opt;
    };
    optionsContainer.appendChild(btn);
  });
}

function submitAnswer() {
  if (!selectedOption) {
    document.getElementById('modalFeedback').innerText = '⚠️ Please select an answer!';
    document.getElementById('modalFeedback').style.color = '#ffd700';
    return;
  }
  
  const feedbackEl = document.getElementById('modalFeedback');
  const btns = document.querySelectorAll('.option-btn');
  
  btns.forEach(btn => {
    if (btn.innerText.includes(currentQuestion.ans)) btn.classList.add('correct');
    else if (btn.classList.contains('selected')) btn.classList.add('wrong');
  });
  
  const points = parseInt(currentQuestion.price.replace(/[^0-9]/g, '')) || 200;
  
  if (selectedOption === currentQuestion.ans) {
    studentScore += points;
    feedbackEl.innerText = `✅ Correct! ${currentQuestion.exp}`;
    feedbackEl.style.color = '#22c55e';
    createConfetti(50);
  } else {
    teacherScore += points;
    feedbackEl.innerText = ` Oops! Answer: ${currentQuestion.ans}. ${currentQuestion.exp}`;
    feedbackEl.style.color = '#ef4444';
  }
  
  updateScores();
  setTimeout(closeModal, 3500);
}

function skipQuestion() {
  const points = parseInt(currentQuestion.price.replace(/[^0-9]/g, '')) || 200;
  teacherScore += points;
  updateScores();
  closeModal();
}

function closeModal() {
  document.getElementById('questionModal').classList.remove('active');
  document.getElementById('rollBtn').disabled = false;
  isRolling = false;
  document.getElementById('centerMessage').innerText = 'Roll the dice again!';
}

function updateScores() {
  document.getElementById('studentScore').innerText = studentScore;
  document.getElementById('teacherScore').innerText = teacherScore;
}

function createConfetti(amount) {
  const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3', '#00bcd4', '#4CAF50', '#FFEB3B', '#FF9800', '#ffd700'];
  for (let i = 0; i < amount; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (Math.random() * 2 + 2) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
}
